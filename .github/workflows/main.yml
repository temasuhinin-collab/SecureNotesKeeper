name: Build SecureNotesKeeper

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build executable
      run: |
        pyinstaller --onefile --noconsole --name "SecureNotesKeeper" main.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SecureNotesKeeper-Windows
        path: dist/SecureNotesKeeper.exe

  # Если вы захотите собирать и для Linux:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    - name: Build executable
      run: |
        pyinstaller --onefile --noconsole --name "SecureNotesKeeper" main.py
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SecureNotesKeeper-Linux
        path: dist/SecureNotesKeeper
